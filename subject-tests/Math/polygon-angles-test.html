<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test: Polygon Angles</title>
  <link rel="stylesheet" href="../../style.css?v=1">
  <style>
    .test-container {
      max-width: 600px;
      margin: 2rem auto;
      padding: 2rem;
    }
    
    .question {
      margin-bottom: 2rem;
      padding: 1.5rem;
      background: var(--bg-secondary);
      border-radius: 0.5rem;
    }
    
    .question h4 {
      margin-top: 0;
    }
    
    .options label {
      display: block;
      padding: 0.5rem;
      margin: 0.5rem 0;
      cursor: pointer;
    }
    
    .options input[type="radio"] {
      margin-right: 0.5rem;
    }
    
    .submit-test {
      padding: 1rem 2rem;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 0.5rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
    }
    
    .results {
      margin-top: 2rem;
      padding: 2rem;
      border-radius: 0.5rem;
      text-align: center;
      display: none;
    }
    
    .results.show {
      display: block;
    }
    
    .results.pass {
      background: rgba(7, 181, 0, 0.1);
      border: 2px solid #07b500;
    }
    
    .results.fail {
      background: rgba(255, 0, 0, 0.1);
      border: 2px solid #ff0000;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="mark">JHS</span>
      <h1>Study Guide</h1>
    </div>
  </header>

  <main class="test-container">
    <div class="hero">
      <h2>Test: Polygon Angles</h2>
      <p>Answer all questions. You need 60% to pass.</p>
    </div>

    <form id="test-form">
      <div class="question">
        <h4>1. What is the sum of interior angles in a pentagon?</h4>
        <div class="options">
          <label><input type="radio" name="q1" value="wrong1"> 540°</label>
          <label><input type="radio" name="q1" value="correct"> 540°</label>
          <label><input type="radio" name="q1" value="wrong2"> 720°</label>
          <label><input type="radio" name="q1" value="wrong3"> 900°</label>
        </div>
      </div>

      <div class="question">
        <h4>2. What is an exterior angle?</h4>
        <div class="options">
          <label><input type="radio" name="q2" value="wrong1"> The angle inside the polygon</label>
          <label><input type="radio" name="q2" value="correct"> The angle formed by one side and an extension of an adjacent side</label>
          <label><input type="radio" name="q2" value="wrong2"> The angle of rotation</label>
          <label><input type="radio" name="q2" value="wrong3"> None of the above</label>
        </div>
      </div>

      <button type="submit" class="submit-test">Submit Test</button>
    </form>

    <div id="results" class="results">
      <h3 id="results-title"></h3>
      <p id="results-text"></p>
      <a href="../../studyguide-subjects/MATH/Polygon-Angles.html" class="btn-test">← Back to lesson</a>
    </div>
  </main>

  <script src="../../assets/js/streak.js" defer></script>
  <script>
    document.getElementById('test-form').addEventListener('submit', (e) => {
      e.preventDefault();
      
      const answers = {
        q1: document.querySelector('input[name="q1"]:checked')?.value,
        q2: document.querySelector('input[name="q2"]:checked')?.value,
      };
      
      let correct = 0;
      if (answers.q1 === 'correct') correct++;
      if (answers.q2 === 'correct') correct++;
      
      const score = Math.round((correct / 2) * 100);
      const passed = score >= 60;
      
      // Record streak
      StreakManager.recordTestCompletion('Polygon Angles', score);
      
      // Show results
      const resultsDiv = document.getElementById('results');
      const title = document.getElementById('results-title');
      const text = document.getElementById('results-text');
      
      resultsDiv.classList.add(passed ? 'pass' : 'fail');
      resultsDiv.classList.add('show');
      
      title.textContent = passed ? '🎉 Test Passed!' : '❌ Try Again';
      text.textContent = `You scored ${score}%. ${passed ? '🔥 Streak continued!' : 'Study the material and try again.'}`;
      
      document.getElementById('test-form').style.display = 'none';
    });
  </script>
</body>
</html>
